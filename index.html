<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Daily Desk</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#101827;color:#f1f5f9;padding:clamp(12px,2.4vw,30px)}main{max-width:1250px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.card{background:#1b283a;border:1px solid #344257;border-radius:20px;padding:22px}.left{display:grid;gap:16px}.clock{font-size:clamp(56px,9vw,115px);letter-spacing:-.065em;font-weight:650;line-height:1.12;font-variant-numeric:tabular-nums}.muted{color:#9eafc5}.date{font-size:21px;margin:12px 0 0}.weatherrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.weather{background:#24354b;padding:17px;border-radius:15px}.temp{font-size:clamp(28px,4vw,48px);font-weight:650;margin:10px 0}.weather small{color:#bdcbdc}.header{display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:19px;margin:0 0 14px}a{color:#a8d3ff;text-decoration:none}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{padding:9px 0;border-radius:10px;font-size:15px}.day.dim{color:#60748e}.day.today{background:#5a91db;color:#fff;font-weight:700}.weekday{color:#9eafc5;font-size:13px}.scholar{display:flex;justify-content:space-between;align-items:center;gap:12px}.scholar b{font-size:19px}.scholar p{margin:6px 0 0;font-size:13px}.tag{background:#30445c;padding:8px 12px;border-radius:12px;white-space:nowrap}.foot{font-size:12px;color:#8498b1;margin-top:15px}@media(max-width:700px){main{grid-template-columns:1fr}.weatherrow{grid-template-columns:1fr 1fr}.card{padding:16px}.clock{font-size:66px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main><section class="left"><div class="card"><div class="muted">DAILY DESK · NEW JERSEY</div><div id="clock" class="clock">--:--</div><div class="date muted" id="date">加载中…</div></div><div class="card"><div class="header"><h2>天气</h2><span class="muted" id="weatherUpdated">等待更新</span></div><div class="weatherrow"><div class="weather"><div>Hoboken</div><div class="temp" id="temp1">--°C</div><small id="detail1">加载中…</small></div><div class="weather"><div>Jersey City Heights</div><div class="temp" id="temp2">--°C</div><small id="detail2">加载中…</small></div></div></div><div class="card"><div class="scholar"><div><b>Google Scholar</b><p class="muted" id="scholarStatus">点击查看最新引用数据</p></div><a class="tag" href="https://scholar.google.com/citations?user=hmaRRBUAAAAJ&amp;hl=en" target="_blank" rel="noopener">打开主页 ↗</a></div><div id="scholarMetrics" class="foot"></div></div></section><section class="card"><div class="header"><h2 id="month"></h2><div><button id="prev" aria-label="上个月">‹</button> <button id="next" aria-label="下个月">›</button></div></div><div class="calendar" id="calendar"></div><p class="foot">时间按 America/New_York 显示 · 天气来自 Open-Meteo</p></section></main><script>
const zone='America/New_York';const clock=document.getElementById('clock'),dateEl=document.getElementById('date');const fmt=(opt,d=new Date())=>new Intl.DateTimeFormat('zh-CN',{timeZone:zone,...opt}).format(d);function tick(){clock.textContent=fmt({hour:'2-digit',minute:'2-digit',hour12:false});dateEl.textContent=fmt({year:'numeric',month:'long',day:'numeric',weekday:'long'})}tick();setInterval(tick,1000);
let view=new Date();function calendar(){let year=view.getFullYear(),month=view.getMonth(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),offset=first.getDay(),nowParts=new Intl.DateTimeFormat('en-US',{timeZone:zone,year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()),v=k=>Number(nowParts.find(x=>x.type===k).value);document.getElementById('month').textContent=`${year} 年 ${month+1} 月`;let html=['日','一','二','三','四','五','六'].map(x=>`<div class="day weekday">${x}</div>`).join('');for(let i=0;i<offset;i++)html+='<div></div>';for(let d=1;d<=days;d++)html+=`<div class="day ${d===v('day')&&month+1===v('month')&&year===v('year')?'today':''}">${d}</div>`;document.getElementById('calendar').innerHTML=html}calendar();document.getElementById('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);calendar()};document.getElementById('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);calendar()};
const codes={0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',45:'有雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'强毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'阵雨',82:'强阵雨',95:'雷雨'};async function weather(){const places=[{lat:40.744,lon:-74.032},{lat:40.748,lon:-74.052}];await Promise.all(places.map(async(p,i)=>{let n=i+1;try{let url=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,apparent_temperature,weather_code&temperature_unit=celsius&timezone=America%2FNew_York`;let r=await fetch(url);if(!r.ok)throw Error(r.status);let x=(await r.json()).current;document.getElementById('temp'+n).textContent=`${Math.round(x.temperature_2m)}°C`;document.getElementById('detail'+n).textContent=`${codes[x.weather_code]||'天气更新'} · 体感 ${Math.round(x.apparent_temperature)}°C`}catch(e){document.getElementById('detail'+n).textContent='暂时无法获取天气'}}));document.getElementById('weatherUpdated').textContent=fmt({hour:'2-digit',minute:'2-digit',hour12:false})+' 更新'}weather();setInterval(weather,30*60*1000);
fetch('./scholar.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{if(typeof x.citations==='number'){document.getElementById('scholarStatus').textContent='引用量 '+x.citations+(typeof x.h_index==='number'?' · h-index '+x.h_index:'');document.getElementById('scholarMetrics').textContent='最近成功同步：'+(x.updated_at||'未知')}else throw Error()}).catch(()=>{});
</script></body></html>
