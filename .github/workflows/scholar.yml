name: Update Google Scholar metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12,23 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch Scholar metrics
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from scholarly import scholarly

          author = scholarly.search_author_id("hmaRRBUAAAAJ")
          author = scholarly.fill(author, sections=["indices"])

          data = {
              "citations": author.get("citedby"),
              "h_index": author.get("hindex"),
              "i10_index": author.get("i10index"),
              "updated_at": datetime.now(timezone.utc).isoformat()
          }

          with open("scholar.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print(data)
          PY

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar.json
          git diff --cached --quiet || (git commit -m "Update Scholar metrics" && git push)
